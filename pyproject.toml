[project]
name = "tiny-llm-serve"
version = "0.1.0"
description = "A tiny LLM inference and serving engine, built from scratch in Python + PyTorch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.23.0",
    "safetensors>=0.8.0",
    "torch>=2.13.0",
    "transformers>=5.13.1",
]


[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Always summarize skips: tests that need a checkpoint skip themselves, and a
# bare `s` in the progress line hides how much didn't run.
addopts = "-ra"
# The benchmarks package lives at the repo root (it is tooling, not part of
# the installed library), so tests need the root on sys.path to import it.
pythonpath = ["."]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyrefly]
# Tests are left unchecked: they poke at transformers' loosely-typed API surface,
# where checking buys little and forces casts that add noise without runtime value.
project-includes = ["src"]
python-version = "3.12"

[tool.pyrefly.errors]
# Flag `# pyrefly: ignore` comments that have stopped suppressing anything, so
# the third-party stub workarounds get deleted once upstream types improve.
unused-ignore = true

[dependency-groups]
dev = [
    "pdbpp>=0.12.1",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
