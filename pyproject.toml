[project]
name = "tiny-llm-serve"
version = "0.1.0"
description = "A tiny LLM inference and serving engine, built from scratch in Python + PyTorch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.23.0",
    "safetensors>=0.8.0",
    "torch>=2.13.0",
    "transformers>=5.13.1",
]


[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Always summarize skips: tests that need a checkpoint skip themselves, and a
# bare `s` in the progress line hides how much didn't run.
addopts = "-ra"

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [
    "pdbpp>=0.12.1",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
