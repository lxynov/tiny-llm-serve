name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync

      - name: Run format check
        run: uv run ruff format --check

      - name: Run linter
        run: uv run ruff check

      - name: Run type check
        run: uv run pyrefly check

      # The tests fetch Qwen/Qwen3-0.6B (~1.4GB) on first use. Restoring it here
      # keeps every run from re-downloading it, and keeps CI from depending on
      # the hub being reachable. The key is fixed rather than hashed over the
      # lockfile: the checkpoint is pinned by name, so a dependency bump is no
      # reason to fetch it again.
      - name: Cache the Hugging Face checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-0.6b

      - name: Run tests
        run: uv run pytest -q
